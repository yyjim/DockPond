# Generated by swift-style from .swift-style.yml. Do not edit. Run: bundle exec swift-style sync
allow_zero_lintable_files: true
analyzer_rules:
- unused_declaration
- unused_import
disabled_rules:
- force_cast
- type_body_length
- file_length
- function_body_length
- todo
- private_over_fileprivate
- closure_parameter_position
- function_parameter_count
- block_based_kvo
opt_in_rules:
- closure_spacing
- multiline_arguments
- multiline_arguments_brackets
- multiline_parameters
- multiline_parameters_brackets
- multiline_function_chains
- multiline_literal_brackets
- operator_usage_whitespace
- overridden_super_call
- period_spacing
- private_swiftui_state
- shorthand_optional_binding
- switch_case_on_newline
- vertical_parameter_alignment_on_call
- vertical_whitespace_between_cases
- vertical_whitespace_closing_braces
- vertical_whitespace_opening_braces
- array_init
- closure_end_indentation
- collection_alignment
- contains_over_first_not_nil
- empty_string
- empty_xctest_method
- first_where
- implicit_return
- joined_default_parameter
- legacy_random
- literal_expression_end_indentation
- lower_acl_than_parent
- override_in_extension
- private_action
- private_outlet
- prohibited_interface_builder
- prohibited_super_call
- redundant_nil_coalescing
- redundant_type_annotation
- yoda_condition
custom_rules:
  setup_should_be_setUp:
    regex: "\\bfunc\\s+setup\\w*\\s*\\("
    message: Use 'setUp' instead of 'setup'.
  avoid_negative_guard:
    regex: "(guard\\s+![^,&|]+else\\b|guard\\s+[^,&|]+?==\\s*false\\s+else\\b)"
    message: Prefer 'if condition { ... }' over 'guard !condition else { ... }'
  no_trailing_comment_before_case:
    regex: "[^\\s/][ \\t]*//[^\\n]*\\n[ \\t]*(case\\b[^\\n]*|default|@unknown\\s+default):[ \\t]*\\n"
    message: Put the comment on its own line above the code, not at the end of the line before a case.
  unnamed_large_tuple:
    name: Unnamed Large Tuple
    regex: |-
      (?x)
      (?<![\w`])(?<![\w`]\s{1,20})\(  # a name before `(` means a call or an enum case, not a tuple type
      (?:
        \s*
        (?:
            \((?:[^():]|\([^()]*\))*\) \s* -> \s* [\w.?!]+                              # function type
          | \((?:[^()]|\([^()]*\))*\)                                                  # nested tuple
          | <[^<>()]*(?:<[^<>()]*>[^<>()]*)*>                                          # generic arguments
          | \[[^\[\]()]*\]                                                             # array / dictionary
          | [\w.?!] | \x20
        )+
        \s* (?:,|(?=\)))
      ){3,}
      \)
      (?!(?:\s|/\*.*?\*/|//[^\n]*)*(?:->|async\b|throws\b|rethrows\b))  # a function type's parameter list, not a tuple
    match_kinds:
    - typeidentifier
    message: 'Tuples with 3 or more elements should label them, e.g. (x: Int, y: Int, z: Int).'
cyclomatic_complexity:
  warning: 25
  error: 25
  ignores_case_statements: true
large_tuple:
  warning: 4
  error: 6
identifier_name:
  min_length: 0
  max_length:
    warning: 60
  excluded:
  - "^[A-Z]$"
  - ".*_.*"
type_name:
  min_length: 0
redundant_discardable_let:
  ignore_swiftui_view_bodies: true
nesting:
  type_level:
    warning: 6
    error: 6
  function_level:
    warning: 5
    error: 10
line_length:
  warning: 140
  ignores_urls: true
  ignores_comments: true
  ignores_multiline_strings: true
  ignores_interpolated_strings: true
  ignores_function_declarations: true
included:
- Package.swift
- Sources
- Tests
- DockPondDemo
excluded:
- ".build"
- build
- DerivedData
